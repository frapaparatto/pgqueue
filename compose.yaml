services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pgqueue
      POSTGRES_PASSWORD: pgqueue
      POSTGRES_DB: pgqueue_test
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pgqueue", "-d", "pgqueue_test"]
      interval: 2s
      timeout: 5s
      retries: 10
