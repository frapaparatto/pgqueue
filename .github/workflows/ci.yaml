name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pgqueue
          POSTGRES_PASSWORD: pgqueue
          POSTGRES_DB: pgqueue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgqueue -d pgqueue_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pgqueue:pgqueue@localhost:5432/pgqueue_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
